<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Хорватия 2024</title>

<style>
body {
    margin: 0;
    background: linear-gradient(135deg, #fff6f0, #e8faff);
    color: #444;
    font-family: Arial;
    text-align: center;
}

.back {
    position: fixed;
    top: 20px;
    left: 20px;
    color: #444;
    font-size: 20px;
    text-decoration: none;
}

.gallery img {
    width: 80%;
    max-width: 700px;
    margin-top: 100px;
    border-radius: 14px;
    transition: 0.3s;
}

.btn {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    background: #ffffffaa;
    border: none;
    color: #444;
    padding: 12px 18px;
    cursor: pointer;
    font-size: 22px;
    border-radius: 10px;
}
.prev { left: 20px; }
.next { right: 20px; }
</style>
</head>

<body>

<a class="back" href="2024.html">← Назад</a>

<div class="gallery">
    <button class="btn prev" id="prev">❮</button>
    <img id="photo" src="montenegro/1.jpg">
    <button class="btn next" id="next">❯</button>
</div>

<script>
const images = [
    "montenegro/1.jpg",
    "montenegro/2.jpg",
    "montenegro/3.jpg"
];

let index = 0;
const photo = document.getElementById("photo");

document.getElementById("next").onclick = () => {
    index = (index + 1) % images.length;
    photo.src = images[index];
};

document.getElementById("prev").onclick = () => {
    index = (index - 1 + images.length) % images.length;
    photo.src = images[index];
};
</script>

</body>
</html>
