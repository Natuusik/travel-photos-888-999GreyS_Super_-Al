<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Хорватия 2024</title>

<style>
body {
    margin: 0;
    background: linear-gradient(135deg, #fff6f0, #e8faff);
    color: #444;
    font-family: Arial;
    text-align: center;
}

.back-btn {
    position: fixed;
    top: 20px;
    left: 20px;
    width: 48px;
    height: 48px;
    background: rgba(255,255,255,0.8);
    backdrop-filter: blur(6px);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #444;
    font-size: 22px;
    text-decoration: none;
    box-shadow: 0 6px 18px rgba(0,0,0,0.15);
    transition: 0.3s;
}

.back-btn:hover {
    transform: scale(1.12);
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    background: rgba(255,255,255,0.95);
}


.gallery img {
    width: 80%;
    max-width: 700px;
    margin-top: 100px;
    border-radius: 14px;
    transition: 0.3s;
}

.btn {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    background: #ffffffaa;
    border: none;
    color: #444;
    padding: 12px 18px;
    cursor: pointer;
    font-size: 22px;
    border-radius: 10px;
}
.prev { left: 20px; }
.next { right: 20px; }
</style>
</head>

<body>

<a href="croatia2024.html" class="back-btn">❮</a>

<div class="gallery">
    <button class="btn prev" id="prev">❮</button>
    <img id="photo" src="montenegro/1.jpg" onclick="nextPhoto()">>
    <button class="btn next" id="next">❯</button>
</div>

<script>
const images = [
    "montenegro/1.jpg",
    "montenegro/2.jpg",
     "montenegro/3.jpg",
      "montenegro/4.jpg",
       "montenegro/5.jpg",
        "montenegro/6.jpg",
         "montenegro/7.jpg",
          "montenegro/8.jpg",
           "montenegro/9.jpg",
            "montenegro/10.jpg",
             "montenegro/11.jpg",
              "montenegro/12.jpg",
               "montenegro/13.jpg",
                "montenegro/14.jpg",
                 "montenegro/15.jpg",
                  "montenegro/16.jpg",
                   "montenegro/17.jpg",
                    "montenegro/18.jpg",
                     "montenegro/19.jpg",
                      "montenegro/20.jpg",
                       "montenegro/21.jpg",
                        "montenegro/22.jpg",
                         "montenegro/23.jpg",
                          "montenegro/24.jpg",
                           "montenegro/25.jpg",
                            "montenegro/26.jpg",
                             "montenegro/27.jpg",
                              "montenegro/28.jpg",  
                               "montenegro/29.jpg",
                                "montenegro/30.jpg",
                                 "montenegro/31.jpg",
                                  "montenegro/32.jpg",
                                   "montenegro/33.jpg",     
                                    "montenegro/34.jpg",
                                     "montenegro/35.jpg",
                                      "montenegro/36.jpg",      
                                       "montenegro/37.jpg", 
                                        "montenegro/38.jpg",
                                         "montenegro/39.jpg",
                                          "montenegro/40.jpg",
                                           "montenegro/41.jpg",
                                             "montenegro/42.jpg"
];

let index = 0;
const photo = document.getElementById("photo");

function nextPhoto() {
    index = (index + 1) % images.length;
    photo.src = images[index];
}

function prevPhoto() {
    index = (index - 1 + images.length) % images.length;
    photo.src = images[index];
}

document.getElementById("next").onclick = nextPhoto;
document.getElementById("prev").onclick = prevPhoto;
document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") nextPhoto();
    if (e.key === "ArrowLeft") prevPhoto();
});


</script>

</body>
</html>
