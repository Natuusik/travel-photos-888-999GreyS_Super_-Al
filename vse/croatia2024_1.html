<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Хорватия 2024</title>

<style>
body {
    margin: 0;
    background: #111;
    color: #fff;
    font-family: Arial;
}

.back-btn {
    position: fixed;
    top: 70px;
    left: 20px;
    padding: 10px 15px;
    background: rgba(255,255,255,0.15);
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    backdrop-filter: blur(4px);
}

.gallery {
    margin-top: 120px;
    text-align: center;
}

.gallery img {
    width: 700px;
    height: 450px;
    object-fit: cover;
    border-radius: 10px;
    transition: 0.4s;
}

.btn {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.5);
    border: none;
    color: #fff;
    padding: 12px 18px;
    cursor: pointer;
    font-size: 20px;
    border-radius: 6px;
}

.prev { left: 20px; }
.next { right: 20px; }
</style>
</head>

<body>

<!-- ПРАВИЛЬНЫЙ ПУТЬ НАЗАД -->
<a href="../index2024.html" class="back-btn">← Назад</a>

<div class="gallery">
    <button class="btn prev" id="prev">❮</button>

    <!-- ПРАВИЛЬНЫЙ ПУТЬ К ПЕРВОЙ КАРТИНКЕ -->
    <img id="photo" src="../Croatia2024/1.jpg">

    <button class="btn next" id="next">❯</button>
</div>

<script>
/* ПРАВИЛЬНЫЕ ПУТИ К ФОТО */
const images = [
    "../Croatia2024/1.jpg",
    "../Croatia2024/2.jpg",
    "../Croatia2024/3.jpg"
];

let index = 0;
const photo = document.getElementById("photo");

document.getElementById("next").onclick = () => {
    index = (index + 1) % images.length;
    changePhoto();
};

document.getElementById("prev").onclick = () => {
    index = (index - 1 + images.length) % images.length;
    changePhoto();
};

function changePhoto() {
    photo.style.opacity = 0;
    setTimeout(() => {
        photo.src = images[index];
        photo.style.opacity = 1;
    }, 300);
}
</script>

</body>
</html>
