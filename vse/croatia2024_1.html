<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Хорватия 2024</title>

<style>
body {
    margin: 0;
    background: #000;
    font-family: Arial;

    /* Центрирование фото */
    display: flex;
    justify-content: center;
    align-items: center;

    height: 100vh;
    overflow: hidden;
}

/* Кнопка назад */
.back-btn {
    position: fixed;
    top: 20px;
    left: 20px;
    width: 48px;
    height: 48px;
    background: rgba(255,255,255,0.8);
    backdrop-filter: blur(6px);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #444;
    font-size: 22px;
    text-decoration: none;
    box-shadow: 0 6px 18px rgba(0,0,0,0.15);
    transition: 0.3s;
    z-index: 10;
}
.back-btn:hover {
    transform: scale(1.12);
}

/* Фото */
#photo {
    max-width: 100vw;
    max-height: 100vh;
    width: auto;
    height: auto;
    object-fit: contain;

    display: block;
    margin: auto;

    opacity: 0;
    transition: opacity 0.25s ease, transform 0.3s ease;
}
#photo.show {
    opacity: 1;
}
.zoomed {
    transform: scale(1.8);
}

/* Кнопки переключения */
.btn {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,0.25);
    backdrop-filter: blur(4px);
    border: none;
    color: #fff;
    padding: 12px 18px;
    cursor: pointer;
    font-size: 26px;
    border-radius: 10px;
    z-index: 10;
}
.prev { left: 20px; }
.next { right: 20px; }

</style>
</head>

<body>

<a href="croatia2024.html" class="back-btn">❮</a>

<button class="btn prev" id="prev">❮</button>
<img id="photo" src="montenegro/1.jpg">
<button class="btn next" id="next">❯</button>

<script>
const images = [
    "montenegro/1.jpg",
    "montenegro/2.jpg",
    "montenegro/3.jpg",
    "montenegro/4.jpg",
    "montenegro/5.jpg",
    "montenegro/6.jpg",
    "montenegro/7.jpg",
    "montenegro/8.jpg",
    "montenegro/9.jpg",
    "montenegro/10.jpg",
    "montenegro/11.jpg",
    "montenegro/12.jpg",
    "montenegro/13.jpg",
    "montenegro/14.jpg",
    "montenegro/15.jpg",
    "montenegro/16.jpg",
    "montenegro/17.jpg",
    "montenegro/18.jpg",
    "montenegro/19.jpg",
    "montenegro/20.jpg",
    "montenegro/21.jpg",
    "montenegro/22.jpg",
    "montenegro/23.jpg",
    "montenegro/24.jpg",
    "montenegro/25.jpg",
    "montenegro/26.jpg",
    "montenegro/27.jpg",
    "montenegro/28.jpg",
    "montenegro/29.jpg",
    "montenegro/30.jpg",
    "montenegro/31.jpg",
    "montenegro/32.jpg",
    "montenegro/33.jpg",
    "montenegro/34.jpg",
    "montenegro/35.jpg",
    "montenegro/36.jpg",
    "montenegro/37.jpg",
    "montenegro/38.jpg",
    "montenegro/39.jpg",
    "montenegro/40.jpg",
    "montenegro/41.jpg",
    "montenegro/42.jpg"
];

let index = 0;
const photo = document.getElementById("photo");

/* Быстрая смена фото */
function changePhoto() {
    photo.classList.remove("show");

    photo.onload = () => {
        photo.classList.add("show");
    };

    photo.src = images[index];
}

function nextPhoto() {
    index = (index + 1) % images.length;
    changePhoto();
}

function prevPhoto() {
    index = (index - 1 + images.length) % images.length;
    changePhoto();
}

/* Листание по кнопкам */
document.getElementById("next").onclick = nextPhoto;
document.getElementById("prev").onclick = prevPhoto;

/* Листание по нажатию на фото */
photo.addEventListener("click", () => {
    nextPhoto();
});

/* Двойной тап — зум */
let lastTap = 0;
photo.addEventListener("click", () => {
    const now = Date.now();
    if (now - lastTap < 300) {
        photo.classList.toggle("zoomed");
    }
    lastTap = now;
});

/* Стрелки на клавиатуре */
document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") nextPhoto();
    if (e.key === "ArrowLeft") prevPhoto();
});
</script>
