<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>2024</title>

<style>
body {
    margin: 0;
    background: linear-gradient(135deg, #e8faff, #fff0f4);
    color: #444;
    font-family: Arial;
}

.back {
    position: fixed;
    top: 20px;
    left: 20px;
    color: #444;
    font-size: 20px;
    text-decoration: none;
}

.cards {
    margin-top: 100px;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 30px;
}

.card {
    width: 260px;
    background: #ffffffcc;
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 0 18px rgba(0,0,0,0.15);
}
.card:hover {
    transform: scale(1.06);
}

.card img {
    width: 100%;
    height: 170px;
    object-fit: cover;
}

.card p {
    text-align: center;
    padding: 14px;
    font-size: 20px;
    font-weight: bold;
}
</style>
</head>

<body>

<a class="back" href="../index.html">← Назад</a>

<div class="cards">

   
    <div class="card" onclick="location.href='croatia2024_1.html'">
        <img src="montenegro/2.jpg">
        <p>Хорватия 2024 </p>
    </div>

    <div class="card" onclick="location.href='raznoe2024_1.html'">
        <img src="raznoe2024/1.jpg">
        <p>Разное 2024</p>
    </div>

    
</div>

</body>
</html>
