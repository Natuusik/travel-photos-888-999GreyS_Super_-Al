<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Путешествия</title>

<style>
body {
    margin: 0;
    background: #0f0f0f;
    color: #fff;
    font-family: Arial, sans-serif;
}

/* ===== HEADER ===== */
header {
    position: fixed;
    top: 0;
    width: 100%;
    height: 60px;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    padding: 0 20px;
    z-index: 1000;
}

/* ===== BURGER ===== */
.burger {
    width: 32px;
    cursor: pointer;
}
.burger span {
    display: block;
    height: 4px;
    background: #fff;
    margin: 6px 0;
    border-radius: 2px;
    transition: 0.3s;
}

/* ===== MENU ===== */
.menu {
    position: fixed;
    top: 0;
    right: -260px;
    width: 260px;
    height: 100%;
    background: #1b1b1b;
    padding-top: 80px;
    transition: 0.4s;
    box-shadow: -4px 0 15px rgba(0,0,0,0.5);
}
.menu.open {
    right: 0;
}

.menu a {
    display: block;
    padding: 15px 25px;
    color: #fff;
    font-size: 18px;
    text-decoration: none;
    border-bottom: 1px solid #2a2a2a;
    transition: 0.3s;
}
.menu a:hover {
    background: #333;
}

/* ===== TITLE ===== */
h1 {
    text-align: center;
    margin-top: 100px;
    font-size: 36px;
    letter-spacing: 1px;
}

/* ===== CARDS ===== */
.cards {
    margin-top: 40px;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 35px;
}

.card {
    width: 260px;
    background: #1c1c1c;
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 0 18px rgba(0,0,0,0.45);
}
.card:hover {
    transform: scale(1.06);
    box-shadow: 0 0 25px rgba(0,0,0,0.6);
}

.card img {
    width: 100%;
    height: 170px;
    object-fit: cover;
}

.card p {
    text-align: center;
    padding: 14px;
    font-size: 20px;
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    <div class="burger" id="burger">
        <span></span><span></span><span></span>
    </div>
</header>

<!-- ===== BURGER MENU ===== -->
<div class="menu" id="menu">
    <a href="index.html">2026</a>
    <a href="index.html">2025</a>
    <a href="vse/croatia2024.html">2024</a>
    <a href="index.html">2023</a>
    <a href="index.html">2022</a>
    <a href="index.html">2021</a>
    <a href="index.html">2020</a>
    <a href="index.html">2019</a>
    <a href="index.html">2018</a>
</div>

<h1>Мои путешествия</h1>

<div class="cards">

    <!-- Карточка 1 -->
    <div class="card" onclick="location.href='vse/croatia2024.html'">
        <img src="vse/montenegro/1.jpg">
        <p>Хорватия 2024</p>
    </div>

    <!-- Карточка 2 -->
    <div class="card" onclick="location.href='vse/croatia2024_1.html'">
        <img src="vse/montenegro/2.jpg">
        <p>Хорватия 2024 — часть 2</p>
    </div>

</div>

<script>
const burger = document.getElementById("burger");
const menu = document.getElementById("menu");

burger.onclick = () => {
    menu.classList.toggle("open");
};
</script>

</body>
</html>
