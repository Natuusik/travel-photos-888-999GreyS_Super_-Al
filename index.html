<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Галерея</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: #fff;
}

/* ===== HEADER + BURGER ===== */
header {
    position: fixed;
    top: 0;
    width: 100%;
    height: 60px;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    padding: 0 20px;
    z-index: 1000;
}

.burger {
    width: 30px;
    cursor: pointer;
}
.burger span {
    display: block;
    height: 4px;
    background: #fff;
    margin: 6px 0;
    transition: 0.3s;
}

/* ===== MENU ===== */
.menu {
    position: fixed;
    top: 0;
    right: -250px;
    width: 250px;
    height: 100%;
    background: #222;
    padding-top: 80px;
    transition: 0.4s;
}
.menu.open {
    right: 0;
}

.menu a {
    display: block;
    padding: 15px 20px;
    color: #fff;
    text-decoration: none;
    border-bottom: 1px solid #333;
}
.menu a:hover {
    background: #333;
}

/* ===== MINI CARDS ===== */
.cards {
    margin-top: 100px;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 25px;
}

.card {
    width: 220px;
    background: #1a1a1a;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: 0.3s;
}
.card:hover {
    transform: scale(1.05);
}

.card img {
    width: 100%;
    height: 150px;
    object-fit: cover;
}

.card p {
    text-align: center;
    padding: 10px;
    font-size: 18px;
}
.back-btn {
    position: fixed;
    top: 70px;
    left: 20px;
    padding: 10px 15px;
    background: rgba(255,255,255,0.15);
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    backdrop-filter: blur(4px);
    transition: 0.3s;
}
.back-btn:hover {
    background: rgba(255,255,255,0.3);
}

</style>
</head>

<body>
<a href="index.html" class="back-btn">← На главную</a>

<header>
    <div class="burger" id="burger">
        <span></span><span></span><span></span>
    </div>
</header>

<!-- БУРГЕР-МЕНЮ -->
<div class="menu" id="menu">
    
<a href="index.html" class="back-btn">← На главную</a>
    <a href="index.html">2026</a>
    <a href="index2025.html">2025</a>
    <a href="vse/index2024.html">2024</a>
    <a href="index2023.html">2023</a>
    <a href="index2022.html">2022</a>
    <a href="index2021.html">2021</a>
    <a href="index2020.html">2020</a>
    <a href="index2019.html">2019</a>
    <a href="index2018.html">2018</a>
</div>

<!-- МИНИ-КАРТОЧКИ ГОДОВ которые на главной странице -->
<div class="cards">

    <div class="card" onclick="location.href='index2025.html'">
        <img src="img/preview2025.jpg">
        <p>2025</p>
    </div>

    <div class="card" onclick="location.href='vse/index2024.html'">
        <img src="img/preview2024.jpg">
        <p>2024</p>
    </div>

    <div class="card" onclick="location.href='vse/index2023.html'">
        <img src="img/preview2023.jpg">
        <p>2023</p>
    </div>

    <!-- Добавляешь новые карточки просто копируя блок -->
</div>

<script>
// ===== БУРГЕР =====
const burger = document.getElementById("burger");
const menu = document.getElementById("menu");

burger.onclick = () => {
    menu.classList.toggle("open");
};
</script>

</body>
</html>
